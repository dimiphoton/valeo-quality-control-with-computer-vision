AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Valeo QC — dépôt ECR uniquement, après l'alarme de facturation,
  avant le push Docker et la Lambda.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: valeo-qc
      ImageScanningEnabled: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"expire untagged after 1 day","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}}]}

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  RepositoryName:
    Value: valeo-qc
