[project]
name = "valeo-qc"
version = "0.1.0"
description = "Machine learning · Industry · Python / PyTorch / ONNX / AWS"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "mlflow>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
valeo-qc = "valeo_qc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
